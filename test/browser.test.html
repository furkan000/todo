<!doctype html><meta charset="utf-8"><body>
<iframe id="f" src="../index.html" style="width:1400px;height:900px"></iframe>
<pre id="out">running</pre>
<script>
var log = [], fails = 0;
function ok(n, c, extra) { if (!c) fails++; log.push((c ? 'PASS ' : 'FAIL ') + n + (c ? '' : '  << ' + JSON.stringify(extra))); }
window.onerror = function (m, s, l) { log.push('FAIL uncaught: ' + m + ' @' + l); fails++; };
document.getElementById('f').addEventListener('load', function () {
  var w = this.contentWindow, d = this.contentDocument;
  try {
  w.onerror = function (m,s,l) { log.push('FAIL app error: ' + m + ' @' + l); fails++; };
  try { w.localStorage.clear(); } catch (e) {}
  var ed = d.getElementById('editor'), stage = d.getElementById('stage');
  function $(s) { return d.querySelector(s); }
  function $$(s) { return [].slice.call(d.querySelectorAll(s)); }
  function click(el) { el.dispatchEvent(new w.MouseEvent('click', {bubbles:true})); }

  // --- document view
  ok('15 todos rendered', $$('.todo').length === 15, $$('.todo').length);
  var firstText = ed.value.split('\n')[6];
  ok('sample line 7 is done', /^- \[x\]/.test(firstText), firstText);

  // toggle the first checkbox -> text must flip
  var cb = $('.todo input[data-toggle]');
  cb.checked = false;
  cb.dispatchEvent(new w.Event('change', {bubbles:true}));
  ok('toggle rewrote the text', /^- \[ \] Rewrite/.test(ed.value.split('\n')[6]), ed.value.split('\n')[6]);
  // toggle back
  var cb2 = $('.todo input[data-toggle]'); cb2.checked = true;
  cb2.dispatchEvent(new w.Event('change', {bubbles:true}));
  ok('toggle back', /^- \[x\] Rewrite/.test(ed.value.split('\n')[6]), ed.value.split('\n')[6]);

  // click a chip -> filters
  var chip = $$('.chip.select').filter(function (c) { return c.dataset.q === '#proj:atlas'; })[0];
  ok('atlas chip exists', !!chip);
  click(chip);
  ok('search box filled', d.getElementById('search').value === '#proj:atlas', d.getElementById('search').value);
  ok('stats shows filtered count', /showing <b>4<\/b>/.test(d.getElementById('stats').innerHTML), d.getElementById('stats').textContent);
  var chip2 = $$('.chip.select').filter(function (c) { return c.dataset.q === '#proj:atlas'; })[0];
  click(chip2); // clicking the same tag again clears it
  ok('second click clears filter', d.getElementById('search').value === '', d.getElementById('search').value);
  ok('unfiltered again', $$('.todo').length === 15, $$('.todo').length);

  // --- table view + sorting
  click($('[data-view="table"]'));
  ok('table rendered', !!$('table tbody tr'), stage.className);
  ok('grouped by default', $$('.group').length === 3, $$('.group').length);
  ok('section heads named', $('.group-h').textContent.indexOf('Shipping') === 0, $('.group-h').textContent);
  ok('shared ancestor crumb dropped', !$('.group-h .crumb'), $('.group-h').textContent);
  ok('per-section columns drop unused ones',
     $$('.group')[2].querySelectorAll('th').length < $$('.group')[0].querySelectorAll('th').length,
     [$$('.group')[0].querySelectorAll('th').length, $$('.group')[2].querySelectorAll('th').length]);
  click($('[data-group="0"]'));   // the sort assertions below are about one flat table
  ok('flat mode is one table', $$('table').length === 1, $$('table').length);
  var due0 = $$('table tbody tr .due')[0].textContent;
  ok('default sort is due asc', /2026-08-14/.test(due0), due0);
  click($('th[data-sort="title"]'));
  var t0 = $$('.task-title')[0].textContent;
  ok('sort by title asc', t0 === 'Book the boiler service', t0);
  click($('th[data-sort="title"]'));
  ok('sort by title desc', $$('.task-title')[0].textContent === 'Write the calendar view', $$('.task-title')[0].textContent);
  click($('th[data-sort="ns:priority"]'));
  ok('priority sorts high first', $$('tbody tr')[0].querySelector('.col-select .chip').textContent === 'high', $$('tbody tr')[0].textContent);
  var lastRow = $$('tbody tr').slice(-1)[0];
  ok('no-priority rows sink', lastRow.querySelector('.col-select').textContent === '—', lastRow.textContent);
  // booleans render as yes/no, never blank
  ok('bool column has explicit no', $$('.flag.no').length > 0, $$('.flag.no').length);
  ok('bool column has yes', $$('.flag.yes').length === 5, $$('.flag.yes').length);

  // filter segmented
  click($('[data-filter="done"]'));
  ok('done filter shows 4', $$('tbody tr').length === 4, $$('tbody tr').length);
  click($('[data-filter="all"]'));

  // --- calendar
  click($('[data-view="cal"]'));
  ok('calendar grid', $$('.cal-day').length === 42, $$('.cal-day').length);
  ok('today marked', $$('.cal-day.today').length === 1, $$('.cal-day.today').length);
  ok('has overdue item', $$('.cal-item.overdue').length >= 0);
  var title = $('.cal-title').textContent.trim();
  click($('[data-month="1"]'));
  var title2 = $('.cal-title').textContent.trim();
  ok('next month navigates', title !== title2, [title, title2]);
  click($('[data-month="0"]'));
  ok('today button returns', $('.cal-title').textContent.trim() === title, $('.cal-title').textContent.trim());
  var item = $('.cal-item .t');
  ok('calendar title clips with ellipsis', w.getComputedStyle(item).textOverflow === 'ellipsis', w.getComputedStyle(item).textOverflow);

  // --- tags view
  click($('[data-view="tags"]'));
  ok('5 namespaces listed', $$('.ns-row').length === 5, $$('.ns-row').length);
  ok('taught tags listed', $$('.taught-row').length === 6, $$('.taught-row').length);
  ok('no typo warnings on clean sample', $$('.disco.warn').length === 0);

  // typo catcher fires on a real typo
  ed.value = '- [ ] a #status:"in progress"\n- [ ] b #status:"in progres"\n- [ ] c @2026-13-45';
  ed.dispatchEvent(new w.Event('input', {bubbles:true}));
  ok('typo section appears', $$('.disco.warn').length === 1, $$('.disco.warn').length);
  ok('bad date flagged', /unrecognised date/.test($('.disco.warn').textContent), $('.disco.warn').textContent.slice(0,200));

  // keyboard shortcuts: 1 is Text, the views follow
  d.dispatchEvent(new w.KeyboardEvent('keydown', {key:'1', ctrlKey:true, bubbles:true}));
  ok('ctrl+1 shows the text', w.PTT.state.layout === 'text', w.PTT.state.layout);
  d.dispatchEvent(new w.KeyboardEvent('keydown', {key:'2', ctrlKey:true, bubbles:true}));
  ok('ctrl+2 switches to document', stage.className.indexOf('view-doc') !== -1, stage.className);
  ok('ctrl+2 leaves text mode', w.PTT.state.layout !== 'text', w.PTT.state.layout);
  d.dispatchEvent(new w.KeyboardEvent('keydown', {key:'5', ctrlKey:true, bubbles:true}));
  ok('ctrl+5 switches to tags', stage.className.indexOf('view-tags') !== -1, stage.className);
  d.dispatchEvent(new w.KeyboardEvent('keydown', {key:'2', ctrlKey:true, bubbles:true}));

  // enter continues a list
  ed.value = '- [ ] first';
  ed.setSelectionRange(11, 11);
  ed.dispatchEvent(new w.KeyboardEvent('keydown', {key:'Enter', bubbles:true, cancelable:true}));
  ok('enter continues todo list', ed.value === '- [ ] first\n- [ ] ', JSON.stringify(ed.value));
  ed.dispatchEvent(new w.KeyboardEvent('keydown', {key:'Enter', bubbles:true, cancelable:true}));
  ok('enter on empty item ends list', ed.value === '- [ ] first\n', JSON.stringify(ed.value));

  // --- layout modes
  click($('[data-layout="text"]'));
  ok('text-only hides the views', w.getComputedStyle($('.view-pane')).display === 'none', w.getComputedStyle($('.view-pane')).display);
  ok('text-only keeps the editor', w.getComputedStyle($('.editor-pane')).display !== 'none');
  ok('text-only keeps the status bar', w.getComputedStyle($('.statusbar')).display !== 'none');
  ok('text-only button is active', $('[data-layout="text"]').classList.contains('on'));
  ok('editor spans full width', $('#editor').getBoundingClientRect().width > 900, $('#editor').getBoundingClientRect().width);
  ok('text tab is the one lit', $('[data-layout="text"]').classList.contains('on') &&
     !$$('[data-view]').some(function (b) { return b.classList.contains('on'); }));
  // clicking a view tab while text-only reveals the view again
  click($('[data-view="table"]'));
  ok('view tab leaves text-only', w.PTT.state.layout === 'split', w.PTT.state.layout);
  ok('view tab relights', $('[data-view="table"]').classList.contains('on'));
  click($('[data-layout="view"]'));
  ok('view-only hides the editor', w.getComputedStyle($('.editor-pane')).display === 'none');
  // text mode returns you to the arrangement you were last in, not always split
  click($('[data-layout="text"]'));
  click($('[data-view="doc"]'));
  ok('returns to the previous arrangement', w.PTT.state.layout === 'view', w.PTT.state.layout);
  d.dispatchEvent(new w.KeyboardEvent('keydown', {key:'\\', ctrlKey:true, bubbles:true}));
  ok('ctrl+\\ shows the editor', w.PTT.state.layout === 'split', w.PTT.state.layout);
  d.dispatchEvent(new w.KeyboardEvent('keydown', {key:'\\', ctrlKey:true, bubbles:true}));
  ok('ctrl+\\ hides it again', w.PTT.state.layout === 'view', w.PTT.state.layout);
  d.dispatchEvent(new w.KeyboardEvent('keydown', {key:'\\', ctrlKey:true, bubbles:true}));
  // layout survives a reload (prefs persisted)
  ok('layout is persisted', JSON.parse(w.localStorage.getItem('ptt.prefs.v1')).layout === 'split',
     w.localStorage.getItem('ptt.prefs.v1'));

  // --- export menu
  ed.value = w.PTT.sample; ed.dispatchEvent(new w.Event('input', {bubbles:true}));
  click($('[data-act="menu"]'));
  ok('export menu opens', !$('#export-menu').hidden);
  d.dispatchEvent(new w.KeyboardEvent('keydown', {key:'Escape', bubbles:true}));
  ok('escape closes menu', $('#export-menu').hidden);

  var json = JSON.parse(w.PTT.toJSON());
  ok('json carries the source text', json.text === ed.value);
  ok('json has 15 todos', json.todos.length === 15, json.todos.length);
  ok('json resolves taught tags', json.todos.filter(function(t){return /shed/.test(t.title);})[0].select.color === 'blue');
  ok('json lists vocabulary', Object.keys(json.vocabulary.namespaces).length === 5, Object.keys(json.vocabulary.namespaces));
  ok('json booleans', json.vocabulary.booleans.length === 2);

  var csv = w.PTT.toCSV();
  var head = csv.split('\n')[0];
  ok('csv header has namespaces', /priority/.test(head) && /status/.test(head) && /~billable/.test(head), head);
  ok('csv carries multi-word values', /,in progress,/.test(csv), csv.split('\n')[1]);
  ok('csv quotes cells containing commas', /"a,b"/.test((function(){
    ed.value = '- [ ] t #status:"a,b"'; ed.dispatchEvent(new w.Event('input', {bubbles:true}));
    var c = w.PTT.toCSV(); ed.value = w.PTT.sample; ed.dispatchEvent(new w.Event('input', {bubbles:true})); return c;
  })()));
  ok('csv row count', csv.trim().split('\n').length === 16, csv.trim().split('\n').length);

  // --- import round trips
  w.confirm = function () { return true; };
  var before = ed.value;
  w.PTT.importText('todo.json', JSON.stringify({text: '- [ ] from json @2026-12-01 #ns:v'}));
  ok('json import replaces text', ed.value === '- [ ] from json @2026-12-01 #ns:v', ed.value);
  ok('imported text reparsed', w.PTT.doc().todos[0].due === '2026-12-01', w.PTT.doc().todos[0]);

  ed.value = before; ed.dispatchEvent(new w.Event('input', {bubbles:true}));
  var csvOut = w.PTT.toCSV();
  w.PTT.importText('todo.csv', csvOut);
  var back = w.PTT.doc();
  ok('csv round trip keeps 15 todos', back.todos.length === 15, back.todos.length);
  ok('csv round trip keeps done state', back.todos.filter(function(t){return t.done;}).length === 4, back.todos.filter(function(t){return t.done;}).length);
  ok('csv round trip keeps due dates', back.todos.filter(function(t){return t.due;}).length === 11, back.todos.filter(function(t){return t.due;}).length);
  ok('csv round trip keeps namespaces', back.vocab.namespaces.size === 5, [].concat(Array.from(back.vocab.namespaces.keys())));
  ok('csv round trip keeps quoted value', back.todos.some(function(t){return t.selects.status === 'in progress';}), back.todos.map(function(t){return t.selects.status;}));
  ok('csv round trip keeps booleans', back.todos.filter(function(t){return t.bools.billable;}).length === 4, back.todos.filter(function(t){return t.bools.billable;}).length);
  ok('csv round trip keeps labels', back.vocab.labels.has('home'), Array.from(back.vocab.labels.keys()));
  ok('csv round trip keeps priority', back.todos.filter(function(t){return t.priority;}).length === 7, back.todos.filter(function(t){return t.priority;}).length);

  w.PTT.importText('notes.md', '# raw\n- [ ] plain markdown');
  ok('md import is verbatim', ed.value === '# raw\n- [ ] plain markdown', ed.value);
  ok('bad csv is rejected', w.PTT.csvToText([['a','b'],['1','2']]) === null);

  // --- theme (restore the sample: earlier tests replaced the text)
  ed.value = w.PTT.sample; ed.dispatchEvent(new w.Event('input', {bubbles:true}));
  click($('[data-view="doc"]'));
  function rgbAvg(c) { var m = c.match(/\d+/g); return (+m[0] + +m[1] + +m[2]) / 3; }
  var root = d.documentElement;
  w.PTT.state.theme = 'auto'; w.PTT.applyTheme();
  ok('auto resolves to the system value', root.dataset.theme ===
     (w.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'), root.dataset.theme);
  w.PTT.state.theme = 'light'; w.PTT.applyTheme();
  ok('light attribute set', root.dataset.theme === 'light');
  var lightBg = rgbAvg(w.getComputedStyle(d.body).backgroundColor);
  ok('light really is light', lightBg > 200, lightBg);
  ok('light ink is dark', rgbAvg(w.getComputedStyle(d.body).color) < 70, w.getComputedStyle(d.body).color);
  // headless reports prefers-color-scheme: dark, so this proves the explicit
  // choice beats the media query rather than just agreeing with it
  ok('system prefers dark here', w.matchMedia('(prefers-color-scheme: dark)').matches);
  ok('explicit light overrides system dark', lightBg > 200, lightBg);
  var chipLight = rgbAvg(w.getComputedStyle($('.chip.select')).backgroundColor);
  ok('chips follow the light theme', chipLight > 200, chipLight);
  // nodes that existed before the switch must repaint too, not just the tokens
  ok('existing checkboxes repaint on switch',
     rgbAvg(w.getComputedStyle($('.todo input:not(:checked) + .box')).backgroundColor) > 200,
     w.getComputedStyle($('.todo input:not(:checked) + .box')).backgroundColor);
  // the guard is transient: it holds during the switch and lifts on the next frame
  ok('theme switch suppresses transitions', d.documentElement.classList.contains('theme-switching') &&
     w.getComputedStyle($('.todo .box')).transitionProperty === 'none',
     w.getComputedStyle($('.todo .box')).transitionProperty);
  ok('existing panels repaint on switch',
     rgbAvg(w.getComputedStyle($('.editor-pane')).backgroundColor) > 200,
     w.getComputedStyle($('.editor-pane')).backgroundColor);
  w.PTT.state.theme = 'dark'; w.PTT.applyTheme();
  var darkBg = rgbAvg(w.getComputedStyle(d.body).backgroundColor);
  ok('dark really is dark', darkBg < 45, darkBg);
  ok('chips follow the dark theme', rgbAvg(w.getComputedStyle($('.chip.select')).backgroundColor) < 90, w.getComputedStyle($('.chip.select')).backgroundColor);
  click($('[data-act="theme"]'));
  ok('theme button cycles dark->auto', w.PTT.state.theme === 'auto', w.PTT.state.theme);
  ok('theme button reflects state', $('[data-act="theme"]').dataset.themeState === 'auto');
  ok('theme is persisted', JSON.parse(w.localStorage.getItem('ptt.prefs.v1')).theme === 'auto');

  // --- reading column is centred, not left-hugged, in view-only
  click($('[data-layout="view"]'));
  click($('[data-view="doc"]'));
  var st = $('.stage').getBoundingClientRect(), h = $('.doc-h').getBoundingClientRect();
  var leftGap = h.left - st.left, rightGap = st.right - h.right;
  ok('doc column is centred', Math.abs(leftGap - rightGap) < 30, {leftGap: leftGap, rightGap: rightGap});
  ok('doc column is capped', h.width <= 821, h.width);
  var p0 = $('.stage p').getBoundingClientRect();
  ok('prose aligns with headings', Math.abs(p0.left - h.left) < 2, {p: p0.left, h: h.left});
  click($('[data-view="tags"]'));
  var sec = $('.disco').getBoundingClientRect(), st2 = $('.stage').getBoundingClientRect();
  ok('tags column is centred', Math.abs((sec.left - st2.left) - (st2.right - sec.right)) < 30);
  click($('[data-layout="split"]'));

  // --- multi-value namespaces
  ed.value = '# People\n\n- [ ] sync #person:Max #person:"Anna Roth" @2026-09-01\n- [ ] 1:1 #person:Max';
  ed.dispatchEvent(new w.Event('input', {bubbles:true}));
  click($('[data-view="table"]'));
  click($('[data-group="0"]'));
  var personCells = $$('tbody tr .col-select');
  ok('multi column renders every value', personCells[0].querySelectorAll('.chip').length === 2,
     personCells[0].textContent);
  ok('single-value row renders one', personCells[1].querySelectorAll('.chip').length === 1,
     personCells[1].textContent);
  ok('each value is separately clickable', personCells[0].querySelectorAll('.chip')[1].dataset.q === '#person:Anna Roth',
     personCells[0].querySelectorAll('.chip')[1].dataset.q);
  click($('[data-view="tags"]'));
  ok('tags view marks it multi', /multi/.test($('.ns-row').textContent), $('.ns-row').textContent);

  // exports carry both people, and importing gets them back
  var mjson = JSON.parse(w.PTT.toJSON());
  ok('json gives multi values as an array', Array.isArray(mjson.todos[0].select.person) &&
     mjson.todos[0].select.person.length === 2, mjson.todos[0].select);
  ok('json records the arity', mjson.vocabulary.namespaces.person.multi === true, mjson.vocabulary.namespaces.person);
  var mcsv = w.PTT.toCSV();
  ok('csv keeps both in one cell', /Max; Anna Roth/.test(mcsv), mcsv.split('\n')[1]);
  w.confirm = function () { return true; };
  w.PTT.importText('people.csv', mcsv);
  var rt = w.PTT.doc();
  ok('csv round trip keeps both people', rt.todos[0].values.person.join('|') === 'Max|Anna Roth',
     rt.todos[0].values);
  ok('csv round trip keeps it multi', rt.vocab.multi.has('person'));
  ok('csv round trip quotes the two-word name', ed.value.indexOf('#person:"Anna Roth"') !== -1, ed.value);
  ed.value = w.PTT.sample; ed.dispatchEvent(new w.Event('input', {bubbles:true}));
  click($('[data-view="table"]'));      // the grouping control only exists in table view
  click($('[data-group="1"]'));

  // --- syntax highlighting
  var wrap = d.getElementById('editor-wrap'), sl = d.getElementById('syntax-layer');
  ed.value = w.PTT.sample; ed.dispatchEvent(new w.Event('input', {bubbles:true}));
  ok('highlighting is on', wrap.classList.contains('hl-on'));
  // the invariant that keeps the layer aligned: same characters, nothing added or lost
  ok('layer text matches the source exactly', sl.textContent === ed.value + '\n',
     [sl.textContent.length, ed.value.length + 1]);
  ok('the caret stays visible', w.getComputedStyle(ed).caretColor !== 'rgba(0, 0, 0, 0)',
     w.getComputedStyle(ed).caretColor);
  ok('layer mirrors the editor font', w.getComputedStyle(sl).fontFamily === w.getComputedStyle(ed).fontFamily);
  ok('layer mirrors the editor padding', w.getComputedStyle(sl).paddingLeft === w.getComputedStyle(ed).paddingLeft,
     [w.getComputedStyle(sl).paddingLeft, w.getComputedStyle(ed).paddingLeft]);
  ok('tags are coloured', sl.querySelectorAll('.hl-sel').length > 0, sl.querySelectorAll('.hl-sel').length);
  ok('booleans are coloured', sl.querySelectorAll('.hl-bool').length === 5, sl.querySelectorAll('.hl-bool').length);
  ok('taught tags are marked', sl.querySelectorAll('.hl-sel.taught').length > 0);
  ok('backticked tags stay literal', sl.querySelectorAll('.hl-code').length > 0 &&
     sl.querySelectorAll('.hl-code .hl-sel').length === 0);
  ed.value = '- [ ] x @notadate'; ed.dispatchEvent(new w.Event('input', {bubbles:true}));
  ok('unparsable dates are flagged', sl.querySelectorAll('.hl-date.bad').length === 1,
     sl.innerHTML.slice(0, 160));
  ok('layer still matches after edits', sl.textContent === ed.value + '\n');
  // html in the source must not become markup in the layer
  ed.value = '- [ ] <script>x</scr' + 'ipt> & <b>'; ed.dispatchEvent(new w.Event('input', {bubbles:true}));
  ok('source html is escaped', sl.querySelector('b') === null && sl.textContent === ed.value + '\n',
     sl.innerHTML.slice(0, 120));
  ed.value = w.PTT.sample; ed.dispatchEvent(new w.Event('input', {bubbles:true}));

  } catch (err) {
    fails++;
    log.push('FAIL threw: ' + (err && err.message) + '  @ ' + String(err && err.stack).split('\n')[1]);
  }
  document.getElementById('out').textContent = log.join('\n') + '\n\n' + (log.length - fails) + ' passed, ' + fails + ' failed';
});
</script>
