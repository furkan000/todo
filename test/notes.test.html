<!doctype html><meta charset="utf-8"><body><iframe id="f" src="../index.html" style="width:1400px;height:900px"></iframe><pre id="out">running</pre>
<script>
var log=[],fails=0;
function ok(n,c,x){if(!c)fails++;log.push((c?'PASS ':'FAIL ')+n+(c?'':'  << '+JSON.stringify(x)));}
document.getElementById('f').addEventListener('load',function(){
 var w=this.contentWindow,d=this.contentDocument;
 try{
  var N=w.Notes,TT=w.TT,ed=d.getElementById('editor');
  function wipe(){Object.keys(w.localStorage).forEach(function(k){if(k.indexOf('ptt.note.')===0)w.localStorage.removeItem(k);});}
  function type(v){ed.value=v;ed.dispatchEvent(new w.Event('input',{bubbles:true}));}
  function click(el){el.dispatchEvent(new w.MouseEvent('click',{bubbles:true}));}
  wipe();

  /* ---- the day runs 02:00 to 02:00 ---- */
  ok('01:59 is still the day before', N.dayOf(new Date(2026,9,10,1,59))==='2026-10-09', N.dayOf(new Date(2026,9,10,1,59)));
  ok('02:00 is the new day', N.dayOf(new Date(2026,9,10,2,0))==='2026-10-10');
  ok('a day is a key of its own', N.keyOf('2026-10-10')==='ptt.note.20261010');
  ok('and the key gives the day back', N.dayOfKey('ptt.note.20261010')==='2026-10-10' && N.dayOfKey('ptt.doc.v1')===null);

  /* ---- conversations ---- */
  var text='woke up early\n\n## 09:30 Standup #team\n- api keys\n### detail\nmore\n\n## Call with Vega #vega\nwants CSV\n- [ ] not a todo';
  var s=N.sections(text);
  ok('text before the first ## is its own section', s.length===3 && s[0].title==='' && s[0].line===0, s.map(function(x){return x.title;}));
  ok('## starts a conversation; ### does not', s[1].title==='Standup' && s[1].time==='09:30' && /more/.test(s[1].text), s[1]);
  ok('tags leave the title', s[2].title==='Call with Vega', s[2].title);
  ok('an empty preamble is dropped', N.sections('\n\n## A\nx').length===1);

  /* ---- tags are the todo list's tags ---- */
  var doc=TT.parseDocument('- [ ] x #client:vega #high');
  var idx=N.vocabulary(doc.vocab,[text,'## Lunch #place:cafe']);
  var tags=N.tagsOf(s[2],idx).map(function(t){return t.q;});
  ok('#vega resolves through the todo vocabulary', tags.indexOf('#client:vega')!==-1, tags);
  ok('a plain label stays a label', N.tagsOf(s[1],idx)[0].q==='#team');
  ok('notes teach each other too', idx.get('cafe').ns==='place');
  ok('priority does not reach into notes', !idx.has('high'));

  /* ---- search is per conversation ---- */
  var notes=[{day:'2026-10-10',text:text},{day:'2026-10-09',text:'## Vega again\nbudget'}];
  var hits=N.search(notes,'#client:vega',idx);
  ok('a namespaced tag finds the bare one', hits.length===1 && hits[0].section.title==='Call with Vega', hits.length);
  hits=N.search(notes,'vega',idx);
  ok('words find conversations across days', hits.length===2 && hits[1].day==='2026-10-09', hits.length);
  hits=N.search(notes,'csv WANTS',idx);
  ok('every word, in any order, any case', hits.length===1 && hits[0].line===text.split('\n').indexOf('wants CSV'), hits);
  ok('all the words, not any', N.search(notes,'csv budget',idx).length===0);
  hits=N.search([{day:'d',text:'## Call with Vega\nfirst\nthe budget'}],'vega budget',idx);
  ok('the snippet is the body line, not the title again', hits[0].text==='the budget', hits[0].text);
  ok('a word and a tag together', N.search(notes,'csv client:vega',idx).length===1);
  ok('a title match outranks a body one', N.search([{day:'d',text:'## Budget\nx\n## Other\nthe budget'}],'budget',idx).sort(function(a,b){return b.score-a.score;})[0].section.title==='Budget');
  ok('marks every word', N.mark('a <b> CSV wants','csv wants')==='a &lt;b&gt; <mark>CSV</mark> <mark>wants</mark>', N.mark('a <b> CSV wants','csv wants'));
  ok('topics count conversations', N.topics(notes,idx).some(function(t){return t.q==='#team'&&t.count===1;}));

  /* ---- the tab ---- */
  w.PTT.setLayout('split');
  click(d.querySelector('[data-view="notes"]'));
  var app=d.getElementById('app');
  ok('notes hide the todo text by default', app.classList.contains('layout-view'), app.className);
  ok('the list of days starts folded away', !d.querySelector('.notes').classList.contains('side-open'));
  click(d.querySelector('[data-note-side]'));
  ok('and opens on the button', d.querySelector('.notes').classList.contains('side-open'));
  ok('which is remembered', JSON.parse(w.localStorage.getItem('ptt.notes.v1')).side===true);
  w.PTT.setLayout('split');
  click(d.querySelector('[data-view="doc"]'));
  ok('the other tabs keep their own arrangement', app.classList.contains('layout-split'));
  w.PTT.setLayout('view');
  click(d.querySelector('[data-view="notes"]'));
  ok('and notes keep the todo text you brought back', app.classList.contains('layout-split'), app.className);
  w.PTT.setLayout('view');
  click(d.querySelector('[data-view="doc"]'));
  ok('while the rest keep theirs', app.classList.contains('layout-view'), app.className);
  w.PTT.setLayout('split');
  click(d.querySelector('[data-view="notes"]'));
  var ned=d.querySelector('.stage .notes-ed');
  ok('the Notes tab shows a page', !!ned);
  ok('opening it puts the caret on the page', d.activeElement===ned);
  ok('today starts blank', ned.value==='' && N.day()===N.today());
  ned.value='## Call with Vega #vega\nwants CSV';
  ned.dispatchEvent(new w.InputEvent('input',{bubbles:true,inputType:'insertText',data:'V'}));
  var key=N.keyOf(N.today());
  ok('what is written is kept under the day', w.localStorage.getItem(key)==='## Call with Vega #vega\nwants CSV', w.localStorage.getItem(key));

  /* ---- the todo text does not disturb a note ---- */
  type('- [ ] x #client:vega\n');
  ok('a render keeps the very same page', d.querySelector('.stage .notes-ed')===ned);
  ok('and a note is not a todo', w.PTT.doc().todos.length===1);

  /* ---- the time after ## ---- */
  ned.focus(); ned.setSelectionRange(ned.value.length,ned.value.length);
  d.execCommand('insertText',false,'\n##');
  ned.dispatchEvent(new w.KeyboardEvent('keydown',{key:' ',bubbles:true,cancelable:true}));
  ok('## and a space write the time at the end', /\n##  · \d{2}:\d{2}$/.test(ned.value), ned.value);
  ok('with the caret before it, where the title goes', ned.selectionStart===ned.value.lastIndexOf(' · ')-0 && ned.selectionStart===ned.selectionEnd, [ned.selectionStart, ned.value.lastIndexOf(' · ')]);
  d.execCommand('insertText',false,'Call with Anna #team');
  var last=N.sections(ned.value).pop();
  ok('the title lands before the time', /\n## Call with Anna #team · \d{2}:\d{2}$/.test(ned.value), ned.value);
  ok('and reads as title and time', last.title==='Call with Anna' && /^\d{2}:\d{2}$/.test(last.time), [last.title,last.time]);
  var lay=d.querySelector('.notes-layer .nl-time');
  ok('tags in a note are coloured', !!d.querySelector('.notes-layer .hl-label') && /#team/.test(d.querySelector('.notes-layer').innerHTML));
  ok('the time is painted muted', !!lay && /· \d{2}:\d{2}/.test(lay.textContent), lay&&lay.textContent);
  ok('the old way, time first, still reads', N.sections('## 09:30 Standup')[0].time==='09:30' && N.sections('## 09:30 Standup')[0].title==='Standup');
  ok('a · without a time stays in the title', N.sections('## A · B')[0].title==='A · B' && N.sections('## A · B')[0].time==='');

  /* ---- searching from Notes is searching the notes ---- */
  w.PTT.state.query='csv';
  click(d.querySelector('[data-view="notes"]'));
  ok('the todo search leaves the notes alone', !d.querySelector('.notes-hit') && !!d.querySelector('.notes-day'));
  w.PTT.state.query='';
  ned.dispatchEvent(new w.KeyboardEvent('keydown',{key:'k',ctrlKey:true,bubbles:true,cancelable:true}));
  ok('Ctrl+K in Notes opens Spotlight', w.Spotlight.isOpen() && d.activeElement===w.Spotlight.input() && d.activeElement!==d.getElementById('search'));
  w.Spotlight.close(true);
  click(d.querySelector('[data-act="search"]'));
  ok('so does the magnifier in the bar', w.Spotlight.isOpen());
  w.Spotlight.close(true);
  ok('the side lists days and topics', !!d.querySelector('.notes-day') && !!d.querySelector('.notes-topics [data-q="#client:vega"]'));
  click(d.querySelector('.notes-topics [data-q="#client:vega"]'));
  ok('a topic looks itself up in Spotlight', w.Spotlight.isOpen() && w.Spotlight.input().value==='#client:vega' && w.PTT.state.query==='', w.Spotlight.input().value);
  w.Spotlight.close(true);
  w.Spotlight.input().value='';   // it keeps the last search, by design

  /* ---- export ---- */
  var md=N.toMarkdown(N.all());
  ok('the export carries every day under its date', /^# Notes/.test(md) && md.indexOf('# '+N.today())!==-1 && /wants CSV/.test(md), md);

  /* ---- a past day ---- */
  w.localStorage.setItem('ptt.note.20261001','## Old call\nold');
  click(d.querySelector('[data-view="notes"]'));
  var old=d.querySelector('[data-note-day="2026-10-01"]');
  ok('a past day is listed', !!old);
  click(old);
  ok('and opens', ned.value==='## Old call\nold' && /back to today/.test(d.querySelector('.notes-head').textContent));
  click(d.querySelector('.notes-head [data-note-day]'));
  ok('back to today', N.day()===N.today() && /Vega/.test(ned.value));

  /* ---- a past day from the + ---- */
  if(!N.sideOpen()) click(d.querySelector('[data-note-side]'));
  click(d.querySelector('[data-note-add]'));
  var pick=d.querySelector('.notes-pick input');
  w.document.documentElement.dataset.theme='dark';
  ok('the date picker follows the dark theme', w.getComputedStyle(pick).colorScheme==='dark', w.getComputedStyle(pick).colorScheme);
  w.PTT.applyTheme();
  ok('the + asks for a date', !!pick && pick.max===N.today(), pick&&pick.max);
  // typing the year: "20" is already a whole date, the year 0020
  function pkey(k){pick.dispatchEvent(new w.KeyboardEvent('keydown',{key:k,bubbles:true,cancelable:true}));}
  pkey('2'); pkey('0'); pick.value='0020-09-15';
  pick.dispatchEvent(new w.Event('change',{bubbles:true}));
  ok('a year half typed opens nothing', N.day()!=='0020-09-15' && !!d.querySelector('.notes-pick input'), N.day());
  pkey('2'); pkey('6'); pick.value='2026-09-15';
  pick.dispatchEvent(new w.Event('change',{bubbles:true}));
  ok('nor does the whole one, until Enter', N.day()!=='2026-09-15', N.day());
  pkey('Enter');
  ok('Enter opens that day, blank', N.day()==='2026-09-15' && ned.value==='', N.day());
  ok('listed while it is open', !!d.querySelector('.notes-day [data-note-day="2026-09-15"]'));
  ok('but not kept until written in', w.localStorage.getItem('ptt.note.20260915')===null);
  ned.value='## Dentist';
  ned.dispatchEvent(new w.InputEvent('input',{bubbles:true}));
  ok('writing keeps it', w.localStorage.getItem('ptt.note.20260915')==='## Dentist');
  click(d.querySelector('[data-note-add]'));
  pick=d.querySelector('.notes-pick input');
  pick.value='2026-09-20';
  pick.dispatchEvent(new w.Event('change',{bubbles:true}));
  ok('a day chosen from the calendar opens at once', N.day()==='2026-09-20', N.day());
  click(d.querySelector('[data-note-side]'));

  /* ---- spotlight ---- */
  click(d.querySelector('[data-view="doc"]'));
  ed.focus();
  d.dispatchEvent(new w.KeyboardEvent('keydown',{key:'k',ctrlKey:true,bubbles:true,cancelable:true}));
  ok('outside Notes Ctrl+K is still the todo search', !w.Spotlight.isOpen() && d.activeElement===d.getElementById('search'));
  ed.focus();
  d.dispatchEvent(new w.KeyboardEvent('keydown',{key:'F',ctrlKey:true,shiftKey:true,bubbles:true,cancelable:true}));
  var spot=d.querySelector('.spot'), sq=spot&&spot.querySelector('input');
  ok('Ctrl+Shift+F opens it from any tab', !!spot && !spot.hidden && d.activeElement===sq);
  ok('empty, it lists the latest conversations', spot.querySelectorAll('.spot-row').length>=2);
  function skey(k){sq.dispatchEvent(new w.KeyboardEvent('keydown',{key:k,bubbles:true,cancelable:true}));}
  skey('Escape');
  ok('Esc closes it and gives focus back', spot.hidden && d.activeElement===ed);
  w.Spotlight.open();
  w.Spotlight.input().value='csv wants';
  w.Spotlight.input().dispatchEvent(new w.Event('input'));
  setTimeout(function(){ try{
  var rows=spot.querySelectorAll('.spot-row');
  ok('it finds by every word', rows.length===1 && /Call with Vega/.test(rows[0].textContent), rows.length);
  ok('and marks them', rows[0] && rows[0].querySelectorAll('mark').length>=2);
  ok('the heading\'s tags show beside the title', rows[0] && !!rows[0].querySelector('.spot-tags [data-q="#client:vega"]'), rows[0]&&rows[0].innerHTML);
  skey('Enter');
  ok('Enter opens the conversation in Notes', spot.hidden && w.PTT.state.view==='notes' && N.day()===N.today());
  ok('on the line that matched', ned.value.slice(ned.selectionStart,ned.selectionEnd)==='wants CSV', ned.value.slice(ned.selectionStart,ned.selectionEnd));
  finish();
  }catch(e){ok('no exception',false,e.stack||String(e));report();} },150);
  return;
  function finish(){
  /* ---- the day turns over (last: it moves "today") ---- */
  var tomorrow=new Date(Date.now()+86400e3);
  N.tick(tomorrow);
  ok('a new day is a blank page', N.today()===N.dayOf(tomorrow) && ned.value==='', N.today());
  ok('yesterday is still there', /Vega/.test(w.localStorage.getItem(key)));

  if(N.sideOpen()) click(d.querySelector('[data-note-side]'));   // leave it as it started
  w.localStorage.removeItem('ptt.notes.v1');
  w.PTT.setLayout('split');
  click(d.querySelector('[data-view="doc"]'));
  w.PTT.setLayout('split');
  wipe();
  report();
  }
 }catch(e){ok('no exception',false,e.stack||String(e));report();}
});
function report(){document.getElementById('out').textContent=log.join('\n')+'\n'+(log.length-fails)+' passed, '+fails+' failed';}
</script>
