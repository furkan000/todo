<!doctype html><meta charset="utf-8"><body><iframe id="f" src="../index.html" style="width:1400px;height:900px"></iframe><pre id="out">running</pre>
<script>
var log=[],fails=0;
function ok(n,c,x){if(!c)fails++;log.push((c?'PASS ':'FAIL ')+n+(c?'':'  << '+JSON.stringify(x)));}
document.getElementById('f').addEventListener('load',function(){
 var w=this.contentWindow,d=this.contentDocument;
 try{
  function $(s){return d.querySelector(s);}
  function $$(s){return [].slice.call(d.querySelectorAll(s));}
  function click(el){el.dispatchEvent(new w.MouseEvent('click',{bubbles:true}));}
  function type(v){ed.value=v;ed.dispatchEvent(new w.Event('input',{bubbles:true}));}
  var ed=d.getElementById('editor'), L=w.Log;
  L.clear();

  // a document that loads with work already done must not log it as done now
  type('- [x] already finished\n- [ ] open one');
  ok('pre-done todos are not logged on load', L.count()===0, L.all());

  // ticking the checkbox in the document view
  click($('[data-view="doc"]'));
  var box=$$('.todo input[data-toggle]').filter(function(b){return !b.checked;})[0];
  box.checked=true; box.dispatchEvent(new w.Event('change',{bubbles:true}));
  ok('a checkbox tick is logged', L.count()===1, L.all());
  ok('the entry names the todo', L.all()[0].title==='open one', L.all()[0]);
  ok('the entry has a date and time', /^\d{4}-\d{2}-\d{2} \d{2}:\d{2}$/.test(L.all()[0].at), L.all()[0].at);
  ok('the entry is a completion', L.all()[0].event==='done');

  // typing the x straight into the text counts too
  type('- [ ] typed by hand');
  var before=L.count();
  type('- [x] typed by hand');
  ok('typing the x is logged', L.count()===before+1, L.all().slice(-1));
  ok('it kept the right title', L.all().slice(-1)[0].title==='typed by hand', L.all().slice(-1)[0]);

  // reopening is not an event, but finishing again is
  before=L.count();
  type('- [ ] typed by hand');
  ok('unticking logs nothing', L.count()===before, L.all().slice(-1));
  type('- [x] typed by hand');
  ok('finishing again logs again', L.count()===before+1, L.count());

  // editing a done line must not re-log it
  before=L.count();
  type('- [x] typed by hand with more words');
  ok('editing a done line logs nothing', L.count()===before, L.all().slice(-1));

  // section is captured
  L.clear();
  type('# Week\n\n## Client work\n\n- [ ] invoice');
  type('# Week\n\n## Client work\n\n- [x] invoice');
  ok('the entry records its section', L.all()[0].section==='Client work', L.all()[0]);

  // the log view
  click($('[data-view="log"]'));
  ok('log tab renders entries', $$('.log-day li').length===1, $$('.log-day li').length);
  ok('log groups by day', $$('.log-day').length===1);
  ok('log shows a time', /^\d{2}:\d{2}$/.test($('.log-time').textContent), $('.log-time').textContent);
  ok('log shows the title', $('.log-title').textContent==='invoice', $('.log-title').textContent);

  // exports
  ok('markdown export has the task', /invoice/.test(L.toMarkdown()), L.toMarkdown().slice(0,120));
  ok('markdown export groups by day', /^## \d{4}-\d{2}-\d{2}$/m.test(L.toMarkdown()), L.toMarkdown().slice(0,120));
  ok('csv export has a header', L.toCSV().split('\n')[0]==='when,event,task,parent,section,due,priority,minutes', L.toCSV().split('\n')[0]);
  ok('csv export has the row', /,done,invoice,,Client work,/.test(L.toCSV()), L.toCSV().split('\n')[1]);
  ok('the log rides inside the main json export', JSON.parse(w.PTT.toJSON()).log.length===1);

  // persistence
  ok('the log is saved to storage', JSON.parse(w.localStorage.getItem('ptt.log.v1')).length===1);

  // a wholesale replacement is not a burst of completions
  w.confirm=function(){return true;};
  before=L.count();
  w.PTT.importText('other.md','- [x] imported already done\n- [x] and another');
  ok('importing does not log', L.count()===before, L.all().slice(-2));

  // document view honours the filter now, so finished work can be put away
  type('- [ ] open one\n- [x] done one\n- [x] done two');
  click($('[data-view="doc"]'));
  ok('all filter shows everything', $$('.todo').length===3, $$('.todo').length);
  click($('[data-filter="open"]'));
  ok('open filter hides done todos in the text view', $$('.todo').length===1, $$('.todo').length);
  ok('and says how many are hidden', /2 todos hidden/.test($('.hidden-note').textContent), $('.hidden-note').textContent);
  click($('[data-filter="done"]'));
  ok('done filter shows only finished', $$('.todo').length===2, $$('.todo').length);
  click($('[data-filter="all"]'));
  ok('no note when nothing is hidden', $('.hidden-note')===null);

  // --- removing an entry, with a way back ---
  L.clear();
  type('- [ ] one\n- [ ] two');
  type('- [x] one\n- [x] two');
  click($('[data-view="log"]'));
  ok('two entries to work with', L.count()===2, L.all());
  ok('every row offers a remove', $$('.log-day li .log-del').length===2, $$('.log-del').length);

  var gone=L.all()[0].id, kept=L.all()[1].title;
  click($('[data-log-remove="'+gone+'"]'));
  ok('removing drops the count', L.count()===1, L.all());
  ok('the other entry is untouched', L.all()[0].title===kept, L.all());
  ok('the row stays put, struck through', $$('.log-gone').length===1, $$('.log-gone').length);
  ok('and offers the way back', !!$('.log-gone [data-log-undo="'+gone+'"]'), $('.log-gone').innerHTML);
  ok('the day count only counts what is left', $('.log-day h3 b').textContent==='1', $('.log-day h3 b').textContent);
  ok('storage already has it gone', JSON.parse(w.localStorage.getItem('ptt.log.v1')).length===1);
  ok('an export leaves it out', L.toMarkdown().indexOf('one')===-1, L.toMarkdown());

  click($('[data-log-undo="'+gone+'"]'));
  ok('undo puts it back', L.count()===2, L.all());
  ok('the strike-through is gone', $$('.log-gone').length===0);
  ok('and so is the undo offer', $('[data-log-undo]')===null);
  ok('storage has it again', JSON.parse(w.localStorage.getItem('ptt.log.v1')).length===2);
  ok('it kept its place in the day', $$('.log-day li')[1].textContent.indexOf('one')!==-1, $$('.log-day li')[1].textContent);

  // once the grace runs out it is permanent
  click($('[data-log-remove="'+gone+'"]'));
  ok('it is staged with Undo', w.Undo.is('log:'+gone));
  w.Undo.settle('log:'+gone);
  click($('[data-view="log"]'));
  ok('after the grace it is really gone', L.count()===1 && $$('.log-day li').length===1, L.all());
  ok('and there is nothing left to undo', L.restore(gone)===false);
  ok('storage agrees', JSON.parse(w.localStorage.getItem('ptt.log.v1')).length===1);

  // focus sessions are entries too
  L.clear();
  L.record({event:'focus', title:'deep work', minutes:25});
  click($('[data-view="log"]'));
  ok('a focus session can be removed too', !!$('.log-focus .log-del'), $('.log-focus').innerHTML);
  click($('.log-focus .log-del'));
  ok('and it goes the same way', L.count()===0 && $$('.log-gone').length===1, L.all());
  L.clear();
  ok('clearing forgets what was waiting', w.Undo.pending().length===0, w.Undo.pending());

  // clearing
  L.clear();
  ok('clear empties the log', L.count()===0);
  click($('[data-view="log"]'));
  ok('empty state shown', /Nothing logged yet/.test($('.empty').textContent), $('.empty').textContent);
 }catch(e){fails++;log.push('FAIL threw: '+e.message+' @ '+String(e.stack).split('\n')[1]);}
 document.getElementById('out').textContent=log.join('\n')+'\n\n'+(log.length-fails)+' passed, '+fails+' failed';
});
</script>
