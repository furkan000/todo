<!doctype html><meta charset="utf-8"><body><iframe id="f" src="../index.html" style="width:1400px;height:900px"></iframe><pre id="out">running</pre>
<script>
var log=[],fails=0;
function ok(n,c,x){if(!c)fails++;log.push((c?'PASS ':'FAIL ')+n+(c?'':'  << '+JSON.stringify(x)));}
document.getElementById('f').addEventListener('load',function(){
 var w=this.contentWindow,d=this.contentDocument;
 try{
  var ed=d.getElementById('editor'), sl=d.getElementById('syntax-layer');
  function widths(){return [ed.clientWidth, parseFloat(sl.style.width)];}
  function heights(){return [ed.scrollHeight, sl.scrollHeight];}
  w.PTT.setSplit(30,false);
  var narrow=widths(), nh=heights();
  ok('layer matches the editor width when narrow', Math.abs(narrow[0]-narrow[1])<1, narrow);
  ok('same wrapped height when narrow', Math.abs(nh[0]-nh[1])<6, nh);
  w.PTT.setSplit(70,false);
  var wide=widths(), wh=heights();
  ok('layer follows a widened split', Math.abs(wide[0]-wide[1])<1, wide);
  ok('same wrapped height when wide', Math.abs(wh[0]-wh[1])<6, wh);
  ok('wider really did rewrap (fewer lines)', wh[0] < nh[0], [nh[0], wh[0]]);
  // and across layout changes
  d.querySelector('[data-layout="text"]').dispatchEvent(new w.MouseEvent('click',{bubbles:true}));
  var t=widths();
  ok('layer follows the text-only layout', Math.abs(t[0]-t[1])<1, t);
 }catch(e){fails++;log.push('FAIL threw: '+e.message);}
 document.getElementById('out').textContent=log.join('\n')+'\n\n'+(log.length-fails)+' passed, '+fails+' failed';
});
</script>
